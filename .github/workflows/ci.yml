name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: onlyfans
          POSTGRES_USER: onlyfans
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, pcntl, posix
          coverage: none

      - name: Copy env
        run: cp src/.env.example src/.env

      - name: Generate app key
        working-directory: src
        run: php artisan key:generate

      - name: Install Composer dependencies
        working-directory: src
        run: composer install --no-progress --prefer-dist

      - name: Run migrations
        working-directory: src
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: onlyfans
          DB_USERNAME: onlyfans
          DB_PASSWORD: secret
        run: php artisan migrate:fresh

      - name: Run tests
        working-directory: src
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: onlyfans
          DB_USERNAME: onlyfans
          DB_PASSWORD: secret
          QUEUE_CONNECTION: sync
          CACHE_STORE: array
        run: php artisan test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose config
        run: docker compose config --quiet

      - name: Docker Compose build
        run: docker compose build

      - name: Docker Compose up
        run: docker compose up -d

      - name: Wait for services
        run: sleep 10

      - name: Check services
        run: docker compose ps

      - name: Run migrations
        run: docker compose run --rm artisan migrate:fresh

      - name: Run tests
        run: docker compose run --rm artisan test

      - name: Check dashboard
        run: curl -sf http://localhost/ > /dev/null

      - name: Check Horizon
        run: curl -sf http://localhost/horizon > /dev/null

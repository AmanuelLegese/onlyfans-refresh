server {
    listen 80;
    index index.php index.html;
    server_name _;  # Replace _ with your domain or IP address if you have one
    root /var/www/html/public;

    # Handle all other requests
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Deny hidden files (.env, .git, .htaccess), except .well-known.
    # Listed before the PHP block so it wins for paths like /.hidden.php.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Handle PHP requests (send them to PHP-FPM)
    location ~ \.php$ {
        try_files $uri =404;  # Ensure that only existing files are processed by PHP
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;  # Ensure 'php' matches the PHP service name in docker-compose
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
